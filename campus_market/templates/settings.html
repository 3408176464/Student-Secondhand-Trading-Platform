{% extends "base.html" %}
{% block title %}设置{% endblock %}
{% block content %}
<div class="form-card">
  <h1>设置</h1>
  <form method="post">
    <p>
      <label for="contact">联系方式</label>
      <input id="contact" name="contact" value="{{ g.user.contact or '' }}" autocomplete="tel">
    </p>
    <button type="submit">保存</button>
  </form>
</div>
{% endblock %}
