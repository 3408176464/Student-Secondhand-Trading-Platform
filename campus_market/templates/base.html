<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}校园二手交易平台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-shop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h16l-1 12H5L4 8z"/><path d="M8 8a4 4 0 0 1 8 0"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>
    </symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/>
    </symbol>
    <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12V4h8l9 9-8 8-9-9z"/><circle cx="7.5" cy="7.5" r="1.3"/>
    </symbol>
    <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"/>
    </symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 16l-4-4 4-4"/><path d="M5 12h10"/>
    </symbol>
    <symbol id="i-login" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="8" r="4"/><path d="M4 20c1.6-4 14.4-4 16 0"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>
    </symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('index') }}">
      <svg class="icon" aria-hidden="true"><use href="#i-shop"/></svg>
      校园二手交易平台
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#i-shop"/></svg>商品市场</a>
      {% if g.user %}
        <a href="{{ url_for('publish') }}" {% if request.endpoint == 'publish' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>发布商品</a>
        <a href="{{ url_for('my_orders') }}" {% if request.endpoint == 'my_orders' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#i-receipt"/></svg>我的订单</a>
        <a href="{{ url_for('sales') }}" {% if request.endpoint == 'sales' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#i-tag"/></svg>卖出记录</a>
        <a href="{{ url_for('my_items') }}" {% if request.endpoint == 'my_items' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#i-box"/></svg>我的商品</a>
        <a href="{{ url_for('settings') }}" {% if request.endpoint == 'settings' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg>设置</a>
      {% endif %}
    </nav>
    <div class="nav-right">
      {% if g.user %}
        <form action="{{ url_for('logout') }}" method="post" class="inline">
          <button type="submit"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>登出</button>
        </form>
      {% else %}
        <a class="chip" href="{{ url_for('login') }}"><svg class="icon" aria-hidden="true"><use href="#i-login"/></svg>登录</a>
        <a class="chip" href="{{ url_for('register') }}"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>注册</a>
      {% endif %}
    </div>
  </div>
</header>

<main>
  {% for message in get_flashed_messages() %}
    <div class="flash" role="status">
      <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
      {{ message }}
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>

<footer class="footer">校园二手交易平台 · 校内闲置流转</footer>
</body>
</html>
