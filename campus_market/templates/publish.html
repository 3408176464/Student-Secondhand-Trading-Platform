{% extends "base.html" %}
{% block title %}发布商品{% endblock %}
{% block content %}
<div class="form-card">
  <h1>发布商品</h1>
  <form method="post" enctype="multipart/form-data">
      {{ csrf_field() }}
    <p>
      <label for="title">商品名</label>
      <input id="title" name="title" required>
    </p>
    <p>
      <label for="category_id">分类</label>
      <select id="category_id" name="category_id">
        {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
      </select>
    </p>
    <p>
      <label for="price">价格（元）</label>
      <input id="price" name="price" placeholder="25.00" required inputmode="decimal">
    </p>
    <p>
      <label for="condition">成色</label>
      <select id="condition" name="condition">
        {% for c in conditions %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
      </select>
    </p>
    <p>
      <label for="description">描述</label>
      <textarea id="description" name="description"></textarea>
    </p>
    <p>
      <label for="images">图片（可选，最多 5 张，单张 5MB 内）</label>
      <input id="images" name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <small class="field-hint">支持 JPG / PNG / WebP。有图的东西卖得快得多。</small>
    </p>
    <button type="submit">发布</button>
  </form>
</div>
{% endblock %}
